<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rincón Latino</title>
  <link rel="icon" href="MEDIA/IMG/favicon.svg">
  <link href="CSS/stylelog.css" rel="stylesheet" type="text/css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            guinda: { DEFAULT: '#b60747', dark: '#8f0537', claro: '#e0537f' },
            crema: '#FFFDF6',
            tinta: '#1A1A1A'
          },
          fontFamily: {
            logo: ['"Henny Penny"', 'cursive'],
            texto: ['"Mukta Malar"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style type="text/tailwindcss">
    @layer components {
      .campo {
        @apply w-full rounded-lg border border-stone-300 bg-white px-4 py-3 text-base
               placeholder:text-stone-400 focus:border-guinda focus:outline-none focus:ring-2 focus:ring-guinda/30
               dark:border-white/15 dark:bg-white/5 dark:focus:border-guinda-claro;
      }
      .enlace {
        @apply font-semibold text-guinda underline underline-offset-2 hover:text-guinda-dark
               dark:text-guinda-claro dark:hover:text-white;
      }
      .btn {
        @apply w-full rounded-lg py-3 text-base font-semibold transition-transform duration-200
               hover:scale-[1.03] focus:outline-none focus-visible:ring-2 focus-visible:ring-guinda;
      }
    }
  </style>

  <!-- Aplicar tema ANTES de pintar (evita flash) -->
  <script>
    (function () {
      try {
        const guardado = localStorage.getItem('tema');
        const oscuro = guardado
          ? guardado === 'oscuro'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', oscuro);
      } catch (e) {}
    })();
  </script>
</head>

<body class="min-h-screen bg-stone-100 font-texto text-tinta dark:bg-[#121012] dark:text-crema">

  <div class="mx-auto flex min-h-screen max-w-6xl flex-col px-4 py-6 sm:px-8">

    <header class="flex items-center justify-between">
      <a href="index.html" class="font-logo text-2xl sm:text-3xl">Rincón Latino</a>

      <button id="btn-tema" type="button" aria-label="Cambiar entre modo claro y oscuro"
        class="grid h-10 w-10 place-items-center rounded-full border border-stone-300 bg-white dark:border-white/15 dark:bg-white/5">
        <svg class="h-5 w-5 dark:hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
        <svg class="hidden h-5 w-5 dark:block" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path stroke-linecap="round" d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/>
        </svg>
      </button>
    </header>

    <main class="flex flex-1 items-start justify-center pt-6 pb-8 sm:pt-5 sm:pb-12">
      <section class="w-full max-w-md rounded-2xl border border-stone-200 bg-white p-6 dark:border-white/10 dark:bg-[#1c181b] sm:p-10">

        <h1 class="mt-1 text-3xl font-bold sm:text-4xl">Bienvenido de nuevo</h1>

        <form class="mt-8 space-y-5" action="index.html" method="get">
          <div>
            <label for="email" class="mb-1.5 block text-sm font-semibold">Correo electrónico</label>
            <input id="email" name="email" type="email" autocomplete="email" required
              placeholder="tucorreo@gmail.com" class="campo">
          </div>

          <div>
            <label for="password" class="mb-1.5 block text-sm font-semibold">Contraseña</label>
            <div class="relative">
              <input id="password" name="password" type="password" autocomplete="current-password" required
                placeholder="Tu contraseña" class="campo pr-16">
              <button id="btn-ver" type="button" aria-label="Mostrar contraseña"
                class="absolute inset-y-0 right-0 px-4 text-sm font-semibold text-stone-500 hover:text-guinda dark:text-stone-400">Ver</button>
            </div>
          </div>

          <div class="flex flex-wrap items-center justify-between gap-x-4 gap-y-2 text-sm">
            <label class="flex cursor-pointer items-center gap-2">
              <input type="checkbox" name="recordar" class="h-4 w-4 accent-guinda">
              Recordarme 30 días
            </label>
            <a href="#" class="enlace">¿Olvidaste tu contraseña?</a>
          </div>

          <button type="submit" class="btn bg-guinda text-white hover:bg-guinda-dark">
            Iniciar sesión
          </button>

          <button type="button"
            class="btn flex items-center justify-center gap-3 border border-stone-300 bg-white font-medium dark:border-white/15 dark:bg-white/5">
            <svg class="h-5 w-5" viewBox="0 0 48 48" aria-hidden="true">
              <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/>
              <path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 0 1 0-9.4l-7.9-6.1a24 24 0 0 0 0 21.6l7.9-6.1z"/>
              <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
            </svg>
            Continuar con Google
          </button>
        </form>

        <p class="mt-6 text-center text-sm text-stone-500 dark:text-stone-400">
          ¿No tienes cuenta? <a href="#" class="enlace">Regístrate</a>
        </p>
      </section>
    </main>
  </div>


  <!-- JS PARA CLARO OSCURO -->

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const raiz = document.documentElement;

      const btnTema = document.getElementById('btn-tema');
      if (btnTema) {
        btnTema.addEventListener('click', function () {
          const oscuro = raiz.classList.toggle('dark');
          try { localStorage.setItem('tema', oscuro ? 'oscuro' : 'claro'); } catch (e) {}
        });
      }

      const mq = window.matchMedia('(prefers-color-scheme: dark)');
      const alCambiarSistema = function (e) {
        try { if (localStorage.getItem('tema')) return; } catch (err) {}
        raiz.classList.toggle('dark', e.matches);
      };
      if (mq.addEventListener) {
        mq.addEventListener('change', alCambiarSistema);
      } else if (mq.addListener) {
        mq.addListener(alCambiarSistema);
      }

      const btnVer = document.getElementById('btn-ver');
      const pass = document.getElementById('password');
      if (btnVer && pass) {
        btnVer.addEventListener('click', function () {
          const mostrar = pass.type === 'password';
          pass.type = mostrar ? 'text' : 'password';
          btnVer.textContent = mostrar ? 'Ocultar' : 'Ver';
          btnVer.setAttribute('aria-label', mostrar ? 'Ocultar contraseña' : 'Mostrar contraseña');
        });
      }
    });
  </script>
</body>
</html>
